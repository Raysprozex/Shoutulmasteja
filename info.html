<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // PERBAIKAN 1: 'ID aplikasi' diubah menjadi 'appId'
    const firebaseConfig = { 
      apiKey : "AIzaSyCtx2nxthZPvrOhItetKKNzCWAr0gyTMtU", 
      authDomain : "shoutulmasteja.firebaseapp.com", 
      projectId : "shoutulmasteja", 
      storageBucket : "shoutulmasteja.firebasestorage.app", 
      messagingSenderId : "153000633436", 
      appId : "1:153000633436:web:2a4a469bc647fb0679f299", 
      measurementId : "G-8TWMTF4H3E" 
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.mulaiLogin = () => signInWithPopup(auth, provider);

    // PERBAIKAN 2: Menutup string dengan benar di akhir kalimat
    window.pakaiTemplate = () => {
        const input = document.getElementById('input-msg');
        input.value = "📢 *PENGUMUMAN SHOUTUL MASTEJA*\n\n📍 Alamat: \n🛠 Job: \n🎪 Tempat: \n⏰ Waktu: \n\nhayu urang gembrung!";
        input.style.height = "140px"; 
        input.focus();
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            muatPesan();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    document.getElementById('chat-form').onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('input-msg');
        if (!input.value.trim() || !auth.currentUser) return;
        try {
            await addDoc(collection(db, "messages"), {
                text: input.value,
                uid: auth.currentUser.uid,
                name: auth.currentUser.displayName,
                time: serverTimestamp()
            });
            input.value = "";
            input.style.height = "42px";
        } catch (err) { alert(err.message); }
    };

    function muatPesan() {
        const q = query(collection(db, "messages"), orderBy("time", "asc"), limit(50));
        onSnapshot(q, (snapshot) => {
            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            snapshot.forEach((docSnap) => {
                const d = docSnap.data();
                const isMine = d.uid === auth.currentUser.uid;
                const div = document.createElement('div');
                div.className = `msg ${isMine ? 'mine' : 'others'}`;
                div.innerHTML = `<span style="font-size:10px; font-weight:bold; display:block; margin-bottom:4px; color:${isMine?'#000':'#FFD700'}">${d.name}</span>${d.text}`;
                
                let timer;
                div.ontouchstart = () => {
                    timer = setTimeout(() => {
                        if (confirm("Hapus chat ieu?")) {
                            deleteDoc(doc(db, "messages", docSnap.id));
                        }
                    }, 800);
                };
                div.ontouchend = () => clearTimeout(timer);

                box.appendChild(div);
            });
            window.scrollTo(0, document.body.scrollHeight);
        });
    }
</script>
